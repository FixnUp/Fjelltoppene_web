<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin · Fjelltoppene</title>
<link rel="icon" type="image/svg+xml" href="/assets/logo-mark.svg">
<style>
  :root { --g9:#102a1c; --g8:#1c3f2a; --g6:#2d6a47; --yellow:#f4b740; --paper:#f6f5f1; --line:#dad8d1; --muted:#6a6e69; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: linear-gradient(160deg, var(--g9), var(--g8)); color:#141414; }
  .card { width:100%; max-width:380px; background:var(--paper); border-radius:20px; padding:32px 28px; box-shadow:0 20px 60px rgba(0,0,0,.35); }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:20px; color:var(--g8); margin-bottom:6px; }
  .brand svg { background:var(--g8); border-radius:10px; padding:6px; width:34px; height:34px; }
  h1 { font-size:15px; font-weight:600; color:var(--muted); margin:0 0 24px; }
  label { display:block; font-size:13px; font-weight:700; margin:14px 0 6px; }
  input { width:100%; font:inherit; font-size:16px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  input:focus { outline:3px solid rgba(45,106,71,.3); border-color:var(--g6); }
  button { width:100%; margin-top:22px; font:inherit; font-weight:700; font-size:16px; padding:13px; border:0; border-radius:999px; background:var(--g6); color:#fff; cursor:pointer; }
  button:hover { background:var(--g8); }
  button:disabled { opacity:.6; cursor:default; }
  .err { color:#a12020; font-size:14px; min-height:20px; margin-top:14px; }
  a { color:var(--g6); font-size:14px; }
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none"><path d="M3 19 L9 9 L13 14 L17 7 L21 19 Z" fill="#fff"/><circle cx="17.5" cy="6" r="1.6" fill="#f4b740"/></svg>
    Fjelltoppene
  </div>
  <h1>Logg inn for å redigere nettsiden</h1>
  <label for="u">Brukernavn</label>
  <input id="u" name="username" autocomplete="username" required autofocus>
  <label for="p">Passord</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button id="b" type="submit">Logg inn</button>
  <div class="err" id="e" role="alert"></div>
  <a href="/">← Tilbake til nettsiden</a>
</form>
<script>
  const f = document.getElementById('f'), e = document.getElementById('e'), b = document.getElementById('b');
  f.addEventListener('submit', async (ev) => {
    ev.preventDefault(); e.textContent = ''; b.disabled = true;
    try {
      const r = await fetch('/admin/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CMS': '1' },
        body: JSON.stringify({ user: f.username.value, password: f.password.value }),
      });
      const j = await r.json().catch(() => ({}));
      if (r.ok) { location.href = '/?edit'; return; }
      e.textContent = j.error || 'Innlogging feilet.';
    } catch { e.textContent = 'Fikk ikke kontakt med serveren.'; }
    b.disabled = false;
  });
</script>
</body>
</html>
